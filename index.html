<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة القيادة المؤسسية</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="logo">🔷</div>
    <nav>
      <a href="#" class="nav-item" id="nav-dashboard"><img src="icons/icon_dashboard_1778605746117.png" alt="لوحة التحكم"/></a>
      <a href="#" class="nav-item" id="nav-map"><img src="icons/icon_performance_map_1778605762745.png" alt="خريطة الأداء"/></a>
      <a href="#" class="nav-item" id="nav-strategic"><img src="icons/icon_strategic_performance_1778605777733.png" alt="الأداء الاستراتيجي"/></a>
      <a href="#" class="nav-item" id="nav-operational"><img src="icons/icon_operational_performance_1778605794421.png" alt="الأداء التشغيلي"/></a>
      <a href="#" class="nav-item" id="nav-functional"><img src="icons/icon_functional_performance_1778605810754.png" alt="الأداء الوظيفي"/></a>
      <a href="#" class="nav-item" id="nav-risk"><img src="icons/icon_risk_performance_1778605826370.png" alt="أداء المخاطر"/></a>
      <a href="#" class="nav-item" id="nav-financial"><img src="icons/icon_financial_performance_1778605842074.png" alt="الأداء المالي"/></a>
      <a href="#" class="nav-item" id="nav-governance"><img src="icons/icon_governance_performance_1778605858066.png" alt="أداء الحوكمة"/></a>
      <a href="#" class="nav-item" id="nav-excellence"><img src="icons/icon_excellence_1778605882423.png" alt="التميز المؤسسي"/></a>
      <a href="#" class="nav-item" id="nav-ai"><img src="icons/icon_predictions_ai_1778605899023.png" alt="التنبؤات والذكاء"/></a>
      <a href="#" class="nav-item" id="nav-reading"><img src="icons/icon_integrated_reading_1778605914511.png" alt="القراءة التكاملية"/></a>
      <a href="#" class="nav-item" id="nav-decisions"><img src="icons/icon_decisions_1778605930730.png" alt="القرارات"/></a>
      <a href="#" class="nav-item" id="nav-data"><img src="icons/icon_data_1778605952034.png" alt="البيانات"/></a>
      <a href="#" class="nav-item" id="nav-attachments"><img src="icons/icon_attachments_1778605970801.png" alt="المرفقات"/></a>
    </nav>
  </div>
  <main class="content">
    <header>
      <h1>لوحة القيادة المؤسسية</h1>
    </header>
    <section class="filters">
      <label for="timeRange">نطاق الوقت:</label>
      <select id="timeRange">
        <option value="month">الشهر الحالي</option>
        <option value="quarter">الربع الحالي</option>
        <option value="year">السنة الحالية</option>
      </select>
      <label for="department">القسم:</label>
      <select id="department">
        <option value="all">الكل</option>
        <option value="hr">الموارد البشرية</option>
        <option value="finance">المالية</option>
        <option value="operations">العمليات</option>
      </select>
    </section>
    <section class="kpi-cards">
      <div class="card glass">
        <h3>مؤشر الأداء الاستراتيجي</h3>
        <canvas id="chartStrategic"></canvas>
      </div>
      <div class="card glass">
        <h3>مؤشر الأداء التشغيلي</h3>
        <canvas id="chartOperational"></canvas>
      </div>
      <section class="risk-analysis">
        <h2>تحليل المخاطر</h2>
        <button id="updateRiskBtn">تحديث تحليل المخاطر</button>
        <canvas id="chartRisk" width="400" height="400"></canvas>
      </section>
      <div class="card glass">
        <h3>مؤشر الأداء المالي</h3>
        <canvas id="chartFinancial"></canvas>
      </div>
    </section>
    <section class="chatbot">
      <div class="chat-window glass" id="chatWindow">
        <div class="messages" id="messages"></div>
        <input type="text" id="userInput" placeholder="اكتب سؤالك..." />
        <button id="sendBtn">أرسل</button>
      </div>
    </section>
  </main>
  <script src="env.js"></script>
  <script src="script.js"></script>
</body>
</html>
